services:
  postgres:
    image: postgres:17-alpine
    container_name: ride_connect_db
    restart: always
    ports:
      - 5433:5432
    env_file:
      - back-end/.env
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  node:
    container_name: ride_connect_node
    build:
      context: ./back-end
      target: runner
    restart: always
    expose:
      - 5000
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - back-end/.env

  react:
    container_name: ride_connect_react
    build:
      context: ./front-end
      target: runner
    env_file:
      - front-end/.env
    volumes:
      - react-volume:/var/www/html

  nginx:
    container_name: ride_connect_nginx
    build: ./nginx
    restart: always
    ports:
      - 8080:80
    volumes:
      - react-volume:/var/www/html
    depends_on:
      - postgres
      - node
      - react

volumes:
  postgres-volume:
  react-volume:
